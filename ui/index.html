<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="expanded" data-tabs="top">
  <main id="expanded">
    <header data-tauri-drag-region data-status="idle">
      <span class="dot"></span>
      <span id="title" data-tauri-drag-region>claude</span>
      <span id="status-text" data-tauri-drag-region></span>
      <button class="update" title="Install the new version and restart"></button>
      <button id="folder" title="Open another folder in this tab">📁</button>
      <button id="minimize" title="Shrink to pill">–</button>
    </header>
    <div id="workspace">
      <nav id="tab-bar">
        <span class="handle" title="Drag to move the tabs to another side">⠿</span>
        <div id="tab-list"></div>
        <button id="new-tab" title="New tab in this folder (⌘T)">＋</button>
      </nav>
      <div id="terms"></div>
    </div>
    <div id="grip" title="Resize"></div>
  </main>
  <div id="pill" data-status="idle">
    <span class="handle" data-tauri-drag-region title="Drag">⠿</span>
    <button id="expand" title="Open"><span class="dot"></span><span id="pill-text">claude</span></button>
    <button class="update" title="Install the new version and restart"></button>
  </div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="main.js"></script>
</body>
</html>
