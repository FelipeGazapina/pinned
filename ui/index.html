<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>pinned</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pinned">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gui.css">
<link rel="stylesheet" href="gui-theme.css">
<link rel="stylesheet" href="gui-sidebar.css">
<link rel="stylesheet" href="gui-timeline.css">
<link rel="stylesheet" href="gui-agents.css">
<link rel="stylesheet" href="gui-composer.css">
<link rel="stylesheet" href="gui-panel.css">
<link rel="stylesheet" href="gui-pr.css">

</head>
<body data-view="expanded" data-tabs="top">
  <main id="expanded">
    <header data-tauri-drag-region data-status="idle">
      <span class="dot"></span>
      <span id="title" data-tauri-drag-region>claude</span>
      <span id="status-text" data-tauri-drag-region></span>
      <span id="usage" data-tauri-drag-region hidden></span>
      <button class="update" title="Install the new version and restart"></button>
      <button id="attach" title="Attach files to this session">📎</button>
      <input id="attach-input" type="file" multiple hidden>
      <button id="folder" title="Open another folder in this tab">📁</button>
      <button id="mode-gui" title="App view: threads, diffs and pull requests (⌘E)"><i data-icon="layout-panel-left"></i></button>
      <button id="settings-toggle" title="Settings (⌘,)">⋯</button>
      <button id="minimize" title="Shrink to pill">–</button>
    </header>
    <div id="workspace">
      <aside id="sidebar">
        <div class="brand" data-tauri-drag-region><button id="sidebar-toggle" class="icon" title="Toggle sidebar (⌘B)"><i data-icon="panel-left"></i></button><b data-tauri-drag-region>pinned</b></div>
        <div class="side-head">
          <div class="row"><label class="search"><i data-icon="search"></i><input id="thread-search" placeholder="Search" autocomplete="off" spellcheck="false"><button id="search-clear" class="clear" title="Clear search" hidden><i data-icon="x"></i></button></label>
            <button id="new-thread" class="icon" aria-label="New thread" data-tip="New thread (⌘N)"><i data-icon="square-pen"></i></button></div>
          <div class="row"><button id="project-filter" class="projects" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
            <button id="add-project" class="icon" aria-label="Add project" data-tip="Add project"></button></div>
        </div>
        <div id="thread-list"></div>
        <p id="side-notice" role="status" hidden></p>
        <p id="sync-alert" role="alert" hidden></p>
        <span id="sidebar-resize" title="Drag to resize, double-click to reset"></span>
        <footer><button id="gui-settings" class="icon" aria-label="Settings" data-tip="Settings"><i data-icon="settings"></i></button>
          <button class="icon" data-open-page="pull-requests" aria-label="Pull Requests" data-tip="Pull Requests"><i data-icon="git-pull-request"></i></button>
          <button class="icon" data-open-page="usage" aria-label="Usage" data-tip="Usage"><i data-icon="chart-column"></i></button>
          <button id="mode-terminal" class="icon" aria-label="Terminal view" data-tip="Terminal view (⌘E)"><i data-icon="square-terminal"></i></button>
          <button class="back"><i data-icon="arrow-left"></i>Back</button>
          <button id="side-update" class="icon" data-app-only hidden></button></footer>
      </aside>
      <section id="chat">
        <header id="chat-head" data-tauri-drag-region>
          <button id="chat-sidebar-toggle" class="icon" title="Toggle sidebar (⌘B)"><i data-icon="panel-left"></i></button>
          <span class="crumb" data-tauri-drag-region></span>
          <span id="scripts-control" class="split" hidden></span>
          <span id="open-in" class="split" role="group" aria-label="Open in editor" hidden><button type="button" class="main outline" aria-label="Open"><i data-ic="square-arrow-out-up-right"></i><span class="label">Open</span></button><button type="button" class="pick outline" aria-label="Choose editor"><i data-ic="chevron-down"></i></button></span>
          <span id="git-action" hidden><button class="main"></button><button class="more" title="Git actions"><i data-icon="chevron-down"></i></button></span>
          <div id="header-menu" hidden></div>
          <button id="head-more" class="icon" title="Options" aria-label="Options"><i data-icon="ellipsis"></i></button>
          <span class="controls"><button id="panel-expand" class="icon" title="Maximize panel"><i data-icon="maximize-2"></i></button><button id="toggle-details" class="icon" title="Thread details (⇧⌘B)" aria-label="Thread details"></button><button id="toggle-terminal" class="icon" title="Terminal (⌘J)"><i data-icon="panel-bottom"></i></button>
          <button id="toggle-panel" class="icon" title="Side panel (⌥⌘B)"><i data-icon="panel-right"></i></button>
          <button id="gui-minimize" class="icon" title="Shrink to pill"><i data-icon="minus"></i></button></span>
        </header>
        <div id="thread"></div>
        <div id="thread-find" role="search" hidden><input type="search" placeholder="Find in thread" aria-label="Find in thread" maxlength="200" spellcheck="false" autocomplete="off"><span class="count" aria-live="polite"></span>
          <button type="button" class="xs" data-find-step="-1" title="Previous match"></button><button type="button" class="xs" data-find-step="1" title="Next match"><i data-icon="chevron-down"></i></button><button type="button" class="xs" data-find-close title="Close find"><i data-icon="x"></i></button></div>
        <button type="button" id="scroll-end" hidden><i data-icon="chevron-down"></i>Scroll to end</button>
        <div id="image-zoom" hidden><img alt="Attached image"></div>
        <form id="composer" onsubmit="return false">
          <div id="approval" hidden></div>
          <div id="limit-note" hidden></div>
          <button type="button" id="stash" title="Stashed prompts (⌘S stashes the draft)" hidden><span>Stash</span><span class="count"></span></button>
          <p id="composer-note" hidden></p>
          <div class="box">
            <div id="attachments" hidden></div>
            <textarea id="prompt" rows="1" placeholder="Ask anything"></textarea>
            <div class="tools">
              <span class="controls"><button type="button" id="model-button" class="pick" title="Model (⇧⌘M)"><i data-icon="claude"></i><span class="name">Default</span><i data-icon="chevron-down"></i></button>
                <span class="block" id="traits-block" hidden><span class="sep"></span><button type="button" id="traits-button" class="pick" title="Reasoning (⇧⌘E)"></button></span>
                <span class="block" id="mode-block" hidden><span class="sep"></span><button type="button" id="mode-button" class="pick" title="Access (⇧⌘A)"></button><span class="sep"></span><button type="button" id="plan-toggle" class="pick"></button></span>
                <button type="button" id="more-button" class="pick" aria-label="More composer controls" title="More composer controls" hidden><i data-icon="ellipsis"></i></button></span>
              <span class="spacer"></span>
              <button type="button" id="context-meter" class="icon" hidden></button>
              <button type="button" id="composer-attach" class="icon" title="Attach files"><i data-icon="paperclip"></i></button>
              <button type="button" id="compact-pill" hidden></button>
              <button type="button" id="stop" class="round stop" title="Interrupt"><span class="square"></span></button>
              <button type="button" id="send" class="round send" title="Send (Enter)"><i data-icon="arrow-up"></i></button>
              <span id="pill-actions" hidden></span>
            </div>
            <div id="composer-menu" hidden></div>
          </div>
          <div id="composer-footer"></div>
        </form>
      </section>
      <section id="page-view"></section>
      <aside id="panel">
        <span id="panel-resize" title="Drag to resize"></span>
        <nav id="panel-tabs"><div class="strip" role="tablist"></div><button id="panel-add" class="icon" title="Open a surface (⌘T)"><i data-icon="plus"></i></button><span class="spacer"></span></nav>
        <div id="panel-body"></div>
      </aside>
      <nav id="tab-bar">
        <span class="handle" title="Drag to move the tabs to another side">⠿</span>
        <div id="tab-list"></div>
        <button id="new-tab" title="New tab in a project (⌘T)">＋</button>
        <span id="bar-resize" title="Drag to resize the tabs"></span>
      </nav>
      <div id="keys">
        <button data-send="\u001b">Esc</button><button data-send="\t">Tab</button><button data-send="\u001b[Z" title="Shift-Tab: switch Claude's permission mode">⇧Tab</button><button data-send="\u001b[A">↑</button><button data-send="\u001b[B">↓</button><button data-send="\u0003">Ctrl-C</button><button data-send="\r">Enter</button>
        <button id="paste-key" title="Paste the clipboard's text">Paste</button><button id="select-key" title="Show the terminal's text to select and copy">Select</button>
      </div>
      <div id="terms"><div id="projects" hidden></div><p id="empty">No sessions open. Press ＋ to start one on any of your machines.</p>
        <div id="actions-edge"></div>
        <div id="actions"><button id="actions-toggle" title="Session actions">⋮</button><div id="actions-menu" hidden></div></div>
      </div>
    </div>
    <div id="settings">
      <nav id="settings-nav" aria-label="Settings">
        <div class="head" data-tauri-drag-region><button id="settings-back" class="icon" title="Back to the app (⌘,)" aria-label="Back to the app"><i data-icon="arrow-left"></i></button><b data-tauri-drag-region>Settings</b></div>
        <label class="settings-search"><i data-icon="search"></i><input type="search" placeholder="Search" aria-label="Search settings" role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" spellcheck="false"><kbd>/</kbd><button type="button" class="clear" aria-label="Clear settings search" hidden><i data-icon="x"></i></button></label>
        <p class="settings-none" role="status" hidden>No settings found</p>
        <div class="settings-results" id="settings-search-results" role="listbox" aria-label="Settings search results" hidden></div>
        <div class="links"></div>
      </nav>
      <section id="settings-page" data-settings-page-scroll></section>
    </div>
    <div id="grip" title="Resize"></div>
    <span id="version"></span>
  </main>
  <div id="pill" data-status="idle" data-mode="compact">
    <span class="handle" data-tauri-drag-region title="Drag">⠿</span>
    <div id="carousel"><div id="track"></div></div>
    <button class="update" title="Install the new version and restart"></button>
    <span id="pill-edge" title="Resize"></span>
    <span id="pill-corner" title="Resize"></span>
  </div>
  <form id="login" hidden>
    <h1>pinned</h1>
    <p class="hint">Sign in to reach your machines and their sessions.</p>
    <input name="email" type="email" placeholder="Email" autocomplete="username" required>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <p class="error"></p>
    <div class="actions"><button type="button" class="secondary" name="signup">Create account</button><button class="primary">Sign in</button></div>
  </form>
