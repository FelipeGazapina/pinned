[workspace]
members = [".", "crates/core", "crates/server"]

# scripts/release.sh bumps every `version = ` line in this file, this one included.
[workspace.package]
version = "0.15.1"

[package]
name = "pinned"
version = "0.15.1"
edition = "2021"
default-run = "pinned"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pinned-core = { path = "crates/core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! expands to code that names serde_json.
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
dunce = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"
# Already in the build through wry; the browser panel calls WKWebView for what tauri doesn't wrap.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDate", "NSDictionary", "NSError", "NSNotification", "NSOperation", "NSSet", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSApplication", "NSBitmapImageRep", "NSEvent", "NSImage", "NSImageRep", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow", "block2"] }
objc2-web-kit = { version = "0.3", features = ["WKNavigation", "WKSnapshotConfiguration", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataRecord", "WKWebsiteDataStore", "block2", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-notification = "2"
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
