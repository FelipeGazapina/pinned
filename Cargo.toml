[workspace]
members = [".", "crates/core", "crates/server"]

# scripts/release.sh bumps every `version = ` line in this file, this one included.
[workspace.package]
version = "0.8.1"

[package]
name = "pinned"
version = "0.8.1"
edition = "2021"
default-run = "pinned"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pinned-core = { path = "crates/core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! expands to code that names serde_json.
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"
