[package]
name = "pinned-core"
version.workspace = true
edition = "2021"

[lib]
name = "pinned_core"

[dependencies]
base64 = "0.22"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Pinned so a later schemars release cannot change committed snapshots under us.
schemars = "=1.2.3"
# The binary installs rustls's ring provider before the first request.
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls-no-provider"] }
tokio = { version = "1", features = ["time", "sync", "rt", "net", "macros"] }
# The binary installs rustls's ring provider, as for reqwest. The Go statusline installs it too.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
flate2 = "1"
dunce = "1"
sha2 = "0.10"
# Bundled, so FTS5 is there and the musl and Windows builds need no system SQLite.
rusqlite = { version = "0.41", features = ["bundled"] }
# fancy-regex instead of the default onig, and no esaxx C++, so the musl and Windows builds stay pure Rust.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# Reads a session's screen only while it waits on a menu, to tell when the user answered (menu_watch.rs).
vt100 = "0.15"
# Time zones and five-field cron for schedule.rs. croner evaluates in any chrono zone and handles DST (a skipped
# local time runs at the first valid minute after it, a repeated one once), which the hub scheduler relies on.
chrono-tz = "0.10"
croner = "4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "test-util"] }
# Only the ignored live test reaches the network, and reqwest needs a provider for it.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The app's hub login lives in the OS credential store (login_store.rs). keyring v4's store crates
# wrap security-framework 3.7 and windows-sys 0.61, which the build already has.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
uds_windows = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
