[package]
name = "pinned-core"
version.workspace = true
edition = "2021"

[lib]
name = "pinned_core"

[dependencies]
base64 = "0.22"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Pinned so a later schemars release cannot change committed snapshots under us.
schemars = "=1.2.3"
# The binary installs rustls's ring provider before the first request.
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls-no-provider"] }
tokio = { version = "1", features = ["time", "sync", "rt", "net", "macros"] }
# The binary installs rustls's ring provider, as for reqwest.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
flate2 = "1"
dunce = "1"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
