[package]
name = "pinned-core"
version.workspace = true
edition = "2021"

[lib]
name = "pinned_core"

[dependencies]
base64 = "0.22"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The binary installs rustls's ring provider before the first request.
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls-no-provider"] }
tokio = { version = "1", features = ["time", "sync", "rt", "net", "macros"] }
# The binary installs rustls's ring provider, as for reqwest.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
flate2 = "1"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
