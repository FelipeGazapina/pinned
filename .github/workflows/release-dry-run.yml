name: release-dry-run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-dry-run.yml
      - scripts/updater-fragment.sh
      - scripts/assemble-latest-json.sh
      - scripts/release-asset.sh
      - tauri*.conf.json

# release.yml asks for contents: write, so its caller has to grant it. A dry run never uses it: no step that writes
# a release runs when dry_run is true, and scripts/test-release-rerun.py proves that.
permissions:
  contents: write

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    uses: ./.github/workflows/release.yml
    with:
      dry_run: true
    secrets: inherit
