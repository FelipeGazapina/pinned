name: release-dry-run

# Run by hand only (Actions › release-dry-run › Run workflow), before each release. It inherits the updater signing
# key and the Apple secrets, so no pull_request trigger: a PR-triggered run would hand them to the PR's code.
on:
  workflow_dispatch:

# release.yml asks for contents: write and actions: write, so its caller has to grant them. A dry run never uses
# them: no step that writes a release or starts the hub deploy runs when dry_run is true.
permissions:
  contents: write
  actions: write

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    uses: ./.github/workflows/release.yml
    with:
      dry_run: true
    secrets: inherit
