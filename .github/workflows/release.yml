name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: pinned ${{ github.ref_name }}
          releaseBody: On a Mac, install the .dmg. On Windows, run the _x64-setup.exe. Or click the update button in a running pinned.
          releaseDraft: false
          args: ${{ matrix.args }}

  compat:
    uses: ./.github/workflows/hub-compat.yml

  # Railway deploys the hub from the railway-hub branch, so point it at the released commit.
  # A breaking wire waits for the owner on hub-breaking-change. A crashed check does not deploy.
  hub:
    needs: [build, compat]
    if: always() && needs.build.result == 'success' && (needs.compat.outputs.breaking == 'false' || needs.compat.outputs.approved == 'true')
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/railway-hub" -f sha="${{ github.sha }}" -F force=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
