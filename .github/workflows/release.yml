name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Open a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="On a Mac, install the .dmg. On Windows, run the _x64-setup.exe. Or click the update button in a running pinned."
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --draft --title "pinned $tag" --notes "$notes"
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: pinned ${{ github.ref_name }}
          releaseBody: On a Mac, install the .dmg. On Windows, run the _x64-setup.exe. Or click the update button in a running pinned.
          releaseDraft: true
          args: ${{ matrix.args }}

  linux-node:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for the musl image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build the musl binaries the hub image builds
        run: docker build --target build -t pinned-node-release .
      - name: Copy the binaries out
        run: |
          id=$(docker create pinned-node-release)
          trap 'docker rm "$id"' EXIT
          mkdir -p node-release
          docker cp "$id:/downloads/." node-release
          test -s node-release/pinned-server-x86_64-unknown-linux-musl
          test -s node-release/pinned-server-aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: linux-node-binaries
          path: |
            node-release/pinned-server-x86_64-unknown-linux-musl
            node-release/pinned-server-aarch64-unknown-linux-musl
          if-no-files-found: error

  sign-node:
    needs: [build, linux-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: linux-node-binaries
          path: node-release
      - name: Download the latest.json the desktop jobs uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir node-release --clobber
          test -s node-release/latest.json
      - name: Sign checksums of those exact bytes
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bash scripts/sign-node-sums.sh node-release
      - name: Upload the node files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            node-release/pinned-server-x86_64-unknown-linux-musl \
            node-release/pinned-server-aarch64-unknown-linux-musl \
            node-release/SHA256SUMS \
            node-release/SHA256SUMS.minisig \
            --clobber

  publish:
    needs: [build, sign-node]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
