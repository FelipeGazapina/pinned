name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      dry_run:
        description: Build and verify every leg without a tag, a release or a change to latest.json on GitHub
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify every leg without a tag, a release or a change to latest.json on GitHub
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_NOTES: On a Mac, install the .dmg. On Windows, run the _x64-setup.exe. On Linux (beta), use the AppImage or the .deb, for x86_64 and arm64. The AppImage needs FUSE, or run it with APPIMAGE_EXTRACT_AND_RUN=1. On Linux, dictation and browser-panel screenshots need macOS. Untested so far on Linux are the tray icon on a real desktop including GNOME, Wayland (it runs through XWayland), notifications, keep awake and the updater. Beta testers, please report problems with those. Or click the update button in a running pinned.

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a real release run that is not on a tag
        if: ${{ !inputs.dry_run && github.ref_type != 'tag' }}
        run: |
          echo "a real release runs on a v* tag only, set dry_run to true" >&2
          exit 1
      - name: Open a draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft=true --title "pinned $tag" --notes "$RELEASE_NOTES"
          else
            gh release create "$tag" --draft --title "pinned $tag" --notes "$RELEASE_NOTES"
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential
      - run: npm ci
      - name: Draft the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-asset.sh draft "$GITHUB_REF_NAME"
      # Exports only the secrets that exist, and only on macOS, so without them the app stays ad-hoc signed.
      - name: Sign and notarize with the Developer ID when its secrets exist
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/apple-signing-env.sh >> "$GITHUB_ENV"
      - id: tauri
        if: ${{ !inputs.dry_run }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: pinned ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}
      # No tagName and no releaseId: tauri-action only builds, writes no release and lists the bundles it made.
      - id: tauri-dry
        if: ${{ inputs.dry_run }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          includeUpdaterJson: false
          args: ${{ matrix.args }}
      - name: Write this leg's updater fragment
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths || steps.tauri-dry.outputs.artifactPaths }}
          TARGET: ${{ matrix.target }}
          APP_VERSION: ${{ steps.tauri.outputs.appVersion || steps.tauri-dry.outputs.appVersion }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          tag="$GITHUB_REF_NAME"
          stage=()
          if [[ "$DRY_RUN" == true ]]; then
            tag="v${APP_VERSION}-dryrun"
            stage=(--stage dry-run-bundles)
          fi
          bash scripts/updater-fragment.sh \
            --target "$TARGET" \
            --tag "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --version "$APP_VERSION" \
            --paths "$ARTIFACT_PATHS" \
            --out updater-fragment.json \
            "${stage[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: updater-fragment.json
          if-no-files-found: error
          overwrite: true
      - name: Keep this leg's bundles for the dry-run check
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-bundles-${{ matrix.target }}
          path: dry-run-bundles
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  linux-node:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for the musl image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build the musl binaries the hub image builds
        run: docker build --target build -t pinned-node-release .
      - name: Copy the binaries out
        run: |
          id=$(docker create pinned-node-release)
          trap 'docker rm "$id"' EXIT
          mkdir -p node-release
          docker cp "$id:/downloads/." node-release
          test -s node-release/pinned-server-x86_64-unknown-linux-musl
          test -s node-release/pinned-server-aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: linux-node-binaries
          path: |
            node-release/pinned-server-x86_64-unknown-linux-musl
            node-release/pinned-server-aarch64-unknown-linux-musl
          if-no-files-found: error
          overwrite: true

  sign-node:
    needs: [build, linux-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: linux-node-binaries
          path: node-release
      - run: ls -la node-release
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-fragments
      - name: Assemble latest.json
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pub_date=$(python3 -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%f")[:-3] + "Z")')
          tag="$GITHUB_REF_NAME"
          version=()
          if [[ "$DRY_RUN" == true ]]; then
            fragment_version=$(jq -r '.version' updater-fragments/*/updater-fragment.json | sort -u)
            [[ "$fragment_version" != *$'\n'* && -n "$fragment_version" ]] || {
              echo "the updater fragments disagree on the version: $fragment_version" >&2
              exit 1
            }
            tag="v${fragment_version}-dryrun"
            version=(--version "$fragment_version")
          fi
          bash scripts/assemble-latest-json.sh \
            --notes "$RELEASE_NOTES" \
            --pub-date "$pub_date" \
            --tag "$tag" \
            --out node-release/latest.json \
            "${version[@]}" \
            updater-fragments
      - name: Sign checksums of those exact bytes
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bash scripts/sign-node-sums.sh node-release
      - name: Upload the signed node files
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release-asset.sh upload "$GITHUB_REF_NAME" \
            node-release/SHA256SUMS \
            node-release/SHA256SUMS.minisig \
            node-release/pinned-server-x86_64-unknown-linux-musl \
            node-release/pinned-server-aarch64-unknown-linux-musl \
            node-release/latest.json
      - uses: actions/download-artifact@v4
        if: ${{ inputs.dry_run }}
        with:
          pattern: dry-run-bundles-*
          path: dry-run-release
          merge-multiple: true
      - name: Verify the dry run the way publish does, on local files
        if: ${{ inputs.dry_run }}
        run: |
          cp node-release/* dry-run-release/
          bash scripts/release-asset.sh verify dry-run-release
      - name: Keep the dry-run release files
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-release
          path: dry-run-release
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [build, linux-node, sign-node]
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-asset.sh publish "$GITHUB_REF_NAME"
